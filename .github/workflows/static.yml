name: Publish LoneStarAshes Web UI Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: web-2026-11-24-642
      ZIP_NAME: LoneStarAshes-Web-2026-11-24-642.zip
      ZIP_SHA256: "b3d17b4fc4110b36f314b8a6cd4661fb0a606f70546654225a2729445da56437"
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download and unpack the game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game-release" "$RUNNER_TEMP/site"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP_NAME" \
            --dir "$RUNNER_TEMP/game-release"
          echo "$ZIP_SHA256  $RUNNER_TEMP/game-release/$ZIP_NAME" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/game-release/$ZIP_NAME" -d "$RUNNER_TEMP/site"
          for file in index.html index.js index.wasm index.pck; do
            test -s "$RUNNER_TEMP/site/$file"
          done

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site

      - name: Wait for the Pages artifact to be visible
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          for attempt in {1..15}; do
            if curl --silent --show-error --fail --max-time 5 --get \
                --data-urlencode "name=$artifact_name" "$api" | \
                jq -e --arg name "$artifact_name" 'any(.artifacts[]?; .name == $name and .expired == false)' > /dev/null; then
              echo "Pages artifact $artifact_name is visible."
              sleep 10
              exit 0
            fi
            sleep 4
          done
          echo "Pages artifact $artifact_name was not visible in time." >&2
          exit 1

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
