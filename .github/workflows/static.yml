name: Pages small test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Create a tiny test page
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>LoneStarAshes Pages test</title><h1>Pages连接正常</h1><p>这是临时测试页，不是游戏。</p>' > "$RUNNER_TEMP/site/index.html"

      - name: Upload test page
        uses: actions/upload-pages-artifact@v4
        with:
          name: pages-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site

      - name: Deploy test page
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-test-${{ github.run_id }}-${{ github.run_attempt }}
